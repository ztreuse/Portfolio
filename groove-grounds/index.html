<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="How I designed and built Groove Grounds, a concept coffee shop that speaks dance and still lets anyone order a latte."
    />
    <!-- Link previews (LinkedIn, Messenger, Slack...). They need full addresses: vite.config.js fills in %SITE_URL%. -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Troy Bay" />
    <meta property="og:title" content="Groove Grounds case study | Troy Bay" />
    <meta
      property="og:description"
      content="How I designed and built Groove Grounds, a concept coffee shop that speaks dance and still lets anyone order a latte."
    />
    <meta property="og:url" content="%SITE_URL%groove-grounds/" />
    <meta property="og:image" content="%SITE_URL%og-groove-grounds.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Groove Grounds home page: Coffee with a beat" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#161513" />
    <script>
      // Sets the theme before the first paint (see src/hooks/useTheme.js)
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var light = saved ? saved === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Groove Grounds case study | Troy Bay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root" data-case="groove-grounds"></div>
    <script type="module" src="/src/case-study.jsx"></script>
  </body>
</html>
