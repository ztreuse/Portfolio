    <circle cx="622" cy="512" r="130" />
  </g>
  <g stroke="#3DDC84" stroke-width="9" stroke-linecap="round">
    <line x1="703" y1="410" x2="728" y2="374" />
    <line x1="758" y1="522" x2="802" y2="526" />
  </g>
  <g fill="#FFFFFF">
    <circle cx="648" cy="437" r="11" />
    <circle cx="703" cy="550" r="11" />
